<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Registration Form Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
  </head>
<body><div class="container"><form id="form" novalidate>
<h2>Register</h2>
<div class="field"><label>Full Name</label><input id="name"><small></small></div>
<div class="field"><label>Email</label><input id="email"><small></small></div>
<div class="field"><label>Phone</label><input id="phone"><small></small></div>
<div class="field"><label>Password</label><div class="pw"><input type="password" id="password"><button type="button" id="toggle">Show</button></div><small></small></div>
<div class="field"><label>Confirm Password</label><input type="password" id="confirm"><small></small></div>
<button>Register</button><p id="success"></p>
</form></div><script src="index.js"></script></body></html>
